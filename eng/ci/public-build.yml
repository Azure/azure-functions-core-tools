schedules:
- cron: "0 7 * * *"   # 11pm PST
  displayName: Nightly Build
  branches:
    include:
      - main
      - vnext
  always: true

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - main
    - vnext
    - feature/*
    - release/*

resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-ubuntu-24.04-min
      os: linux
      ${{ if eq( variables['Build.Reason'], 'Schedule' ) }}:
        demands:
        - Priority -equals Low

    sdl:
      sourceAnalysisPool:
        name: 1es-pool-azfunc-public
        image: 1es-windows-2022
        os: windows
      codeql:
         runSourceLanguagesInSourceAnalysis: true

    settings:
      skipBuildTagsForGitHubPullRequests: ${{ variables['System.PullRequest.IsFork'] }}
      networkIsolationPolicy: Preferred, NuGet

    stages:
      - stage: Build
        jobs:
        - template: /eng/ci/templates/jobs/build.yml@self
          parameters:
            projects: Azure.Functions.Cli.slnx
            sign: false
        - job: terminal_windows
          displayName: Windows terminal qualification
          pool:
            name: 1es-pool-azfunc-public
            image: 1es-windows-2022
            os: windows
          steps:
          - template: /eng/ci/templates/steps/setup-dependencies.yml@self
            parameters:
              sign: false
          - task: DotNetCoreCLI@2
            displayName: Restore terminal tests
            inputs:
              command: custom
              custom: restore
              projects: test/Func.Tests/Func.Tests.csproj
          - task: DotNetCoreCLI@2
            displayName: Qualify native input, log viewport, prompt handoff, and interruption
            inputs:
              command: test
              projects: test/Func.Tests/Func.Tests.csproj
              arguments: >-
                -c Release --no-restore -p:CI=true
                --filter "FullyQualifiedName~Console.Terminal|FullyQualifiedName~FullScreenInputHandoffTests|FullyQualifiedName~ConsoleInterruptCoordinatorTests|FullyQualifiedName~LogViewportTests|FullyQualifiedName~CompactLogComponentsTests|FullyQualifiedName~HttpRouteFormatterTests"
            env:
              FUNC_TERMINAL_NATIVE_TESTS: '1'
        - job: terminal_linux
          displayName: Linux terminal qualification
          steps:
          - template: /eng/ci/templates/steps/setup-dependencies.yml@self
            parameters:
              sign: false
          - bash: python3 --version
            displayName: Verify Unix PTY harness prerequisite
          - task: DotNetCoreCLI@2
            displayName: Restore terminal tests
            inputs:
              command: custom
              custom: restore
              projects: test/Func.Tests/Func.Tests.csproj
          - task: DotNetCoreCLI@2
            displayName: Qualify native Unix input and job control
            inputs:
              command: test
              projects: test/Func.Tests/Func.Tests.csproj
              arguments: >-
                -c Release --no-restore -p:CI=true
                --filter "FullyQualifiedName~Console.Terminal|FullyQualifiedName~FullScreenInputHandoffTests|FullyQualifiedName~ConsoleInterruptCoordinatorTests|FullyQualifiedName~LogViewportTests|FullyQualifiedName~CompactLogComponentsTests|FullyQualifiedName~HttpRouteFormatterTests"
            env:
              FUNC_TERMINAL_NATIVE_TESTS: '1'
