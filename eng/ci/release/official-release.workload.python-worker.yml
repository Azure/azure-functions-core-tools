parameters:
- name: public
  displayName: Publish to nuget.org?
  type: boolean
  default: false

# Release has no triggers outside of pipeline
trigger: none
pr: none

extends:
  template: /eng/ci/templates/pipelines/release-packages.yml@self
  parameters:
    public: ${{ parameters.public }}
    folder: workloads/python-worker
    projects: |
      $(Build.SourcesDirectory)/src/Workloads/Workers/Python/Workloads.Workers.Python.csproj
    postPackSteps:
    - pwsh: |
        ./eng/scripts/validate-python-worker-packages.ps1 `
          -PackageDirectory '$(Build.ArtifactStagingDirectory)/pkg' `
          -PythonVersion 3.15
      displayName: Validate Python 3.15 worker packages
