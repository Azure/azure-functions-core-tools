resources:
  repositories:
  - repository: 1es
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: eng
    type: git
    name: engineering
    ref: refs/tags/release

variables:
- template: /ci/variables/cfs.yml@eng

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-24.04-min
      os: linux

    sdl:
      sourceAnalysisPool:
        name: 1es-pool-azfunc
        image: 1es-windows-2022
        os: windows
      codeql:
         runSourceLanguagesInSourceAnalysis: true

    stages:
    - stage: Validate
      jobs:
      - template: /eng/ci/templates/jobs/validate-release-ref.yml@self
        parameters:
          failOnInvalidRef: false
  
    - stage: Build
      dependsOn: Validate

      jobs:
      - template: /eng/ci/templates/jobs/build.yml@self
        parameters:
          sign: false
          # npm packaging is disabled; do not publish or consume drop_npm.
          artifacts: ['publish']
          projects: |
            src/Func/Func.csproj
            test/Func.Tests/Func.Tests.csproj
          build_args: -p:IsReleaseCI=true

    - stage: Release
      dependsOn: ['Build', 'SDLSources']
      jobs:
      - template: /eng/ci/templates/jobs/stage-cli-artifacts.yml@self
        parameters:
          sign: true
          includeNpmPackage: false

    - stage: ApproveRelease
      displayName: Approve CLI release
      dependsOn: Release
      jobs:
      - job: Approve
        displayName: Review CLI release artifacts
        pool: server
        timeoutInMinutes: 1500
        templateContext:
          type: validationJob
        steps:
        - task: ManualValidation@1
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: '[internal]\Azure Functions Core'
            approvers: '[internal]\Azure Functions Core'
            allowApproversToApproveTheirOwnRuns: false
            onTimeout: reject

    - stage: Publish
      dependsOn: ApproveRelease
      jobs:
      - template: /ci/publish-cli.yml@eng
        parameters:
          version: $(Build.BuildNumber)
          npmPackageNames: []
