parameters:
- name: public
  displayName: Publish to nuget.org?
  type: boolean
  default: false

# Release has no triggers outside of pipeline
trigger: none
pr: none

extends:
  template: /eng/ci/templates/pipelines/release-packages.yml@self
  parameters:
    public: ${{ parameters.public }}
    folder: workloads/go-worker
    # This build has no test projects.
    run_tests: false
    projects: |
      $(Build.SourcesDirectory)/src/Workloads/Workers/Go/Workloads.Workers.Go.csproj
