parameters:
- name: projects
  type: string
- name: run_tests
  type: boolean
  default: true
- name: configuration
  type: string
  default: release
- name: artifacts
  type: object
  default: ['pack', 'publish']
- name: sign
  type: boolean
  default: false
- name: build_args
  type: string
  default: ''
- name: npmPackageDirectory
  type: string
  default: ''
- name: npmPackageNames
  type: object
  default:
  - azure-functions-core-tools

jobs:
- job: build

  variables:
  - template: /eng/ci/templates/variables/build.yml@self
  - name: pack_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/pkg
  - name: publish_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/pub
  - name: npm_pack_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/npm

  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
    - ${{ if containsValue(parameters.artifacts, 'pack') }}:
      - output: pipelineArtifact
        displayName: Publish Packages
        path: $(pack_dir)
        artifact: drop_packages
    - ${{ if containsValue(parameters.artifacts, 'publish') }}:
      - output: pipelineArtifact
        displayName: Publish CLI
        path: $(publish_dir)
        artifact: drop_cli
    - ${{ if containsValue(parameters.artifacts, 'npm') }}:
      - output: pipelineArtifact
        displayName: Publish npm packages
        path: $(npm_pack_dir)
        artifact: drop_npm

  steps:
    - template: /eng/ci/templates/steps/setup-dependencies.yml@self
      parameters:
        sign: ${{ parameters.sign }}

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $projects = @($env:PROJECTS -split '\r?\n' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        if ($projects.Count -eq 0) {
          throw 'No projects were provided.'
        }

        if ($projects.Count -eq 1 -and [IO.Path]::GetExtension($projects[0]) -in '.sln', '.slnx', '.slnf') {
          $solution = (Resolve-Path -LiteralPath $projects[0]).Path
        } else {
          $parent = (Resolve-Path -LiteralPath 'Azure.Functions.Cli.slnx').Path
          $solution = Join-Path $env:AGENT_TEMPDIRECTORY 'azure-functions-build.slnf'
          $projectPaths = @($projects | ForEach-Object { (Resolve-Path -LiteralPath $_).Path })
          dotnet new slnf -n azure-functions-build -o $env:AGENT_TEMPDIRECTORY -s $parent --force
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create solution filter.' }
          dotnet sln $solution add @projectPaths
          if ($LASTEXITCODE -ne 0) { throw 'Failed to add projects to solution filter.' }

          $filter = Get-Content -LiteralPath $solution -Raw | ConvertFrom-Json
          $included = @($filter.solution.projects | ForEach-Object { [IO.Path]::GetFullPath($_, (Split-Path -Parent $parent)) })
          foreach ($project in $projectPaths) {
            if ($project -notin $included) {
              throw "Project '$project' is not in the parent solution."
            }
          }
        }
        Write-Host "##vso[task.setvariable variable=build_solution]$solution"
      displayName: Select build solution
      env:
        PROJECTS: ${{ parameters.projects }}

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: custom
        custom: restore
        projects: $(build_solution)
        arguments: -v m ${{ parameters.build_args }}

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: $(build_solution)
        arguments: -c ${{ parameters.configuration }} -v m --no-restore ${{ parameters.build_args }}

    - ${{ if parameters.run_tests }}:
      - task: DotNetCoreCLI@2
        displayName: Unit tests
        inputs:
          command: test
          projects: $(build_solution)
          arguments: -c ${{ parameters.configuration }} -v m --no-build --report-azdo --publish-azdo-test-results ${{ parameters.build_args }}
          # Results are published natively by --publish-azdo-test-results rather than the task's TRX upload.
          publishTestResults: false
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - ${{ if and(containsValue(parameters.artifacts, 'pack'), eq(parameters.sign, true)) }}:
      # Only sign the intermediate DLLs if we are packing.
      # For publishing, we'll sign the final apphost binaries, which is sufficient for code integrity and more performant than signing every DLL.
      - template: ci/sign-files.yml@eng
        parameters:
          displayName: Sign assemblies
          minimatch: true
          signType: dll
          folderPath: out/bin
          pattern: |
            **/Azure.Functions.Cli*.dll
            !**/Azure.Functions.Cli*Test.dll
            !**/Azure.Functions.Cli*Tests.dll

    - ${{ if containsValue(parameters.artifacts, 'pack') }}:
      - task: DotNetCoreCLI@2
        displayName: Pack
        inputs:
          command: custom
          custom: pack
          projects: $(build_solution)
          arguments: -c ${{ parameters.configuration }} -v m -o $(pack_dir) --no-build ${{ parameters.build_args }}

    - ${{ if containsValue(parameters.artifacts, 'publish') }}:
      - task: DotNetCoreCLI@2
        displayName: Publish All Runtimes
        inputs:
          command: custom
          custom: build
          projects: $(build_solution)
          arguments: -c ${{ parameters.configuration }} -v m --no-restore -t:PublishAllRids -p:AllRuntimesPublishRoot=$(publish_dir) ${{ parameters.build_args }}

      - task: CopyFiles@2
        displayName: Copy files
        inputs:
          Contents: |
            install.ps1
            install.sh
          TargetFolder: $(publish_dir)

    - ${{ if containsValue(parameters.artifacts, 'npm') }}:
      - task: NodeTool@0
        displayName: Install Node.js
        inputs:
          versionSpec: 22.x

      - pwsh: |
          $packageNames = @($env:NPM_PACKAGE_NAMES | ConvertFrom-Json)
          & ./eng/scripts/pack-npm.ps1 `
            -PackageDirectory '${{ parameters.npmPackageDirectory }}' `
            -Version '$(Build.BuildNumber)' `
            -PackageNames $packageNames `
            -OutputDirectory '$(npm_pack_dir)'
        displayName: Pack npm packages offline
        env:
          NPM_PACKAGE_NAMES: ${{ convertToJson(parameters.npmPackageNames) }}

    - ${{ if and(containsValue(parameters.artifacts, 'pack'), eq(parameters.sign, true)) }}:
      - template: ci/sign-files.yml@eng
        parameters:
          displayName: Sign nuget packages
          signType: nuget
          folderPath: $(pack_dir)
          pattern: '*.nupkg'
