parameters:
- name: projects
  type: string
- name: configuration
  type: string
  default: release
- name: artifacts
  type: object
  default: ['pack', 'publish']
- name: sign
  type: boolean
  default: false
- name: build_args
  type: string
  default: ''
- name: npmPackageDirectory
  type: string
  default: ''
- name: npmPackageNames
  type: object
  default:
  - azure-functions-core-tools

jobs:
- job: build

  variables:
  - template: /eng/ci/templates/variables/build.yml@self
  - name: pack_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/pkg
  - name: publish_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/pub
  - name: npm_pack_dir
    readonly: true
    value: $(Build.ArtifactStagingDirectory)/npm

  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
    - ${{ if containsValue(parameters.artifacts, 'pack') }}:
      - output: pipelineArtifact
        displayName: Publish Packages
        path: $(pack_dir)
        artifact: drop_packages
    - ${{ if containsValue(parameters.artifacts, 'publish') }}:
      - output: pipelineArtifact
        displayName: Publish CLI
        path: $(publish_dir)
        artifact: drop_cli
    - ${{ if containsValue(parameters.artifacts, 'npm') }}:
      - output: pipelineArtifact
        displayName: Publish npm packages
        path: $(npm_pack_dir)
        artifact: drop_npm

  steps:
    - template: /eng/ci/templates/steps/setup-dependencies.yml@self
      parameters:
        sign: ${{ parameters.sign }}

    - template: /eng/ci/templates/steps/generate-solution-filter.yml@self
      parameters:
        projects: ${{ parameters.projects }}
        variable: build_solution

    - script: dotnet restore "$(build_solution)" -v m ${{ parameters.build_args }}
      displayName: Restore

    - script: >-
        dotnet build "$(build_solution)" -t:DetectTestProjects -p:OutputVariable=has_test_projects -v:m -c ${{ parameters.configuration }} --no-restore
      displayName: Detect test projects

    - script: dotnet build "$(build_solution)" -c ${{ parameters.configuration }} -v m --no-restore ${{ parameters.build_args }}
      displayName: Build

    - script: >-
        dotnet test "$(build_solution)" -c ${{ parameters.configuration }} -v m --no-build
        --report-azdo --publish-azdo-test-results ${{ parameters.build_args }}
      displayName: Unit tests
      condition: and(succeeded(), eq(variables.has_test_projects, 'true'))
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - ${{ if and(containsValue(parameters.artifacts, 'pack'), eq(parameters.sign, true)) }}:
      # Only sign the intermediate DLLs if we are packing.
      # For publishing, we'll sign the final apphost binaries, which is sufficient for code integrity and more performant than signing every DLL.
      - template: ci/sign-files.yml@eng
        parameters:
          displayName: Sign assemblies
          minimatch: true
          signType: dll
          folderPath: out/bin
          pattern: |
            **/Azure.Functions.Cli*.dll
            !**/Azure.Functions.Cli*Test.dll
            !**/Azure.Functions.Cli*Tests.dll

    - ${{ if containsValue(parameters.artifacts, 'pack') }}:
      - script: >-
          dotnet pack "$(build_solution)" -c ${{ parameters.configuration }} -v m
          -o "$(pack_dir)" --no-build ${{ parameters.build_args }}
        displayName: Pack

    - ${{ if containsValue(parameters.artifacts, 'publish') }}:
      - script: >-
          dotnet build "$(build_solution)" -c ${{ parameters.configuration }} -v m --no-restore
          -t:PublishAllRids "-p:AllRuntimesPublishRoot=$(publish_dir)" ${{ parameters.build_args }}
        displayName: Publish All Runtimes

      - task: CopyFiles@2
        displayName: Copy files
        inputs:
          Contents: |
            install.ps1
            install.sh
          TargetFolder: $(publish_dir)

    - ${{ if containsValue(parameters.artifacts, 'npm') }}:
      - task: NodeTool@0
        displayName: Install Node.js
        inputs:
          versionSpec: 22.x

      - pwsh: |
          $packageNames = @($env:NPM_PACKAGE_NAMES | ConvertFrom-Json)
          & ./eng/scripts/pack-npm.ps1 `
            -PackageDirectory '${{ parameters.npmPackageDirectory }}' `
            -Version '$(Build.BuildNumber)' `
            -PackageNames $packageNames `
            -OutputDirectory '$(npm_pack_dir)'
        displayName: Pack npm packages offline
        env:
          NPM_PACKAGE_NAMES: ${{ convertToJson(parameters.npmPackageNames) }}

    - ${{ if and(containsValue(parameters.artifacts, 'pack'), eq(parameters.sign, true)) }}:
      - template: ci/sign-files.yml@eng
        parameters:
          displayName: Sign nuget packages
          signType: nuget
          folderPath: $(pack_dir)
          pattern: '*.nupkg'
