jobs:
- job: Linux_E2E_Test
  timeoutInMinutes: '180'
  displayName: 'E2E Test:'

  pool:
    name: 1es-pool-azfunc-public
    image: 1es-ubuntu-24.04-min
    os: linux

  strategy:
    matrix:
      dotnetIsolated_linux_x64:
        languageWorker: 'DotnetIsolated'
        runtime: 'linux-x64'
      node_linux_x64:
        languageWorker: 'Node'
        runtime: 'linux-x64'
      powershell_linux_x64:
        languageWorker: 'Powershell'
        runtime: 'linux-x64'
      python_linux_x64:
        languageWorker: 'Python'
        runtime: 'linux-x64'
      custom_linux_x64:
        languageWorker: 'Custom'
        runtime: 'linux-x64'
      go_linux_x64:
        languageWorker: 'Go'
        runtime: 'linux-x64'

  variables:
    NPM_CONFIG_USERCONFIG: $(Build.SourcesDirectory)/.npmrc

  steps:
  - template: /eng/ci/templates/steps/install-tools.yml@self

  - template: /eng/ci/templates/steps/authenticate-e2e-dependencies.yml@self

  - script: |
      npx --yes azurite --silent --inMemoryPersistence </dev/null >/dev/null 2>&1 &
    displayName: 'Start azurite'

  - template: /eng/ci/templates/steps/restore-nuget.yml@self

  - pwsh: |
      dotnet publish src/Cli/func/Azure.Functions.Cli.csproj `
        -c Release `
        -f net10.0 `
        -r $(runtime) `
        --self-contained `
        -o $(Build.ArtifactStagingDirectory)/artifacts/$(runtime)
    displayName: 'Publish CLI ($(runtime))'

  - bash: |
      chmod +x $(Build.ArtifactStagingDirectory)/artifacts/$(runtime)/func
    displayName: 'Make CLI binaries executable'

  - template: /eng/ci/templates/steps/run-e2e-tests.yml@self
    parameters:
      worker: $(languageWorker)
      runtime: $(runtime)
