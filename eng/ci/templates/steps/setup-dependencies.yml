parameters:
- name: sign
  type: boolean
  default: false

steps:
- task: UseDotNet@2 # The pinned SDK we use to build
  displayName: Install .NET SDK from global.json
  inputs:
    packageType: sdk
    useGlobalJson: true

- ${{ if parameters.sign }}:
  - task: UseDotNet@2 # ESRP doesn't yet support net10 SDK
    displayName: Install .NET 9 SDK (for esrp tool)
    inputs:
      packageType: sdk
      version: 9.x

- task: NuGetAuthenticate@1
  displayName: Authenticate to NuGet feeds
