parameters:
- name: nugetConfigPath
  displayName: Path to the NuGet.Config file to patch
  type: string
  default: $(Build.SourcesDirectory)/NuGet.Config

steps:
- pwsh: |
    $path = '${{ parameters.nugetConfigPath }}'
    if (-not (Test-Path $path)) {
      Write-Host "##vso[task.logissue type=error] nuget config not found at: $path"
      exit 1
    }

    [xml]$xml = Get-Content -LiteralPath $path
    $sources = $xml.configuration.packageSources
    if ($null -eq $sources) {
      Write-Host "##vso[task.logissue type=error]No <packageSources> element found in $path"
      exit 1
    }

    $internalUpstreamUrl = 'https://pkgs.dev.azure.com/azfunc/internal/_packaging/upstream/nuget/v3/index.json'

    $publicUpstream = $sources.add | Where-Object { $_.key -eq 'upstream-public' }
    if ($null -eq $publicUpstream) {
      Write-Host "##[warning]No <add key='upstream-public' .../> entry found in $path; nothing to replace."
      exit 0
    }

    $upstream = $xml.CreateElement('add')
    $upstream.SetAttribute('key', 'upstream')
    $upstream.SetAttribute('value', $internalUpstreamUrl)
    [void]$sources.ReplaceChild($upstream, $publicUpstream)

    # Update packageSourceMapping to match the renamed source
    $mapping = $xml.configuration.packageSourceMapping
    if ($null -ne $mapping) {
      $mappingSource = $mapping.SelectSingleNode("packageSource[@key='upstream-public']")
      if ($null -ne $mappingSource) {
        $mappingSource.SetAttribute('key', 'upstream')
      }
    }

    $xml.Save($path)
    Write-Host "Replaced 'upstream-public' with internal 'upstream' feed in $path"
    Get-Content -LiteralPath $path
  displayName: Replace upstream-public with internal upstream feed
