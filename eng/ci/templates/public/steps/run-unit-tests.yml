steps:
- task: DotNetCoreCLI@2
  displayName: 'Run unit tests'
  inputs:
    command: 'test'
    projects: '**/Azure.Functions.Cli.UnitTests.csproj'
    arguments: '--framework net10.0'

- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true
    searchFolder: $(Agent.TempDirectory)
  condition: succeededOrFailed()

- task: NodeTool@0
  displayName: 'Install Node 24 for connector template checks'
  inputs:
    versionSpec: '24.x'

- pwsh: |
    $testFile = Join-Path $PWD 'test' 'Cli' 'Func.UnitTests' 'node-connector-templates.test.mjs'
    node --test $testFile
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  displayName: 'Validate built-in JavaScript and TypeScript connector templates'